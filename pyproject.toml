[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "build-up-local"
version = "0.2.0"
description = "Evidence-first local research agent with compounding knowledge vaults and study"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["deep-research", "agents", "ollama", "local-first", "evidence", "knowledge-vault"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "icalendar>=6.1",
  "pdfminer.six>=20231228",
  "prompt_toolkit>=3.0,<4",
  "pyfiglet>=1.0,<2",
  "requests>=2.31,<3",
  "rich>=13.7,<15",
]

[project.scripts]
buildup = "buildup:main"

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = ["build>=1.2", "coverage>=7.6", "pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/2betforyou/build-up"
Repository = "https://github.com/2betforyou/build-up"
Issues = "https://github.com/2betforyou/build-up/issues"

[tool.setuptools]
package-dir = {"" = "router"}

[tool.setuptools.package-data]
buildup = [
  "builtin_skills/*/SKILL.md",
  "builtin_skills/*/agents/*.yaml",
  "builtin_skills/*/references/*.md",
]

[tool.setuptools.packages.find]
where = ["router"]
include = ["buildup*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
